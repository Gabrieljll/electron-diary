<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pombero Alcoholic App</title>
    <link rel="stylesheet" href="./bootstrap.min.css">
    <link rel="stylesheet" href="./animate.css">
    <link rel="stylesheet" href="app.css">
</head>
<body>    
    <main class="container-fluid">
        <nav>
            <div>
                <img class="logoImg" src="./img/logo/logo.png" alt="LOGO">
            </div>
            <div class="div-botones-nav">
                <button class="btn btn-light nav-buttons" onclick="mostrarVista('ventas')">
                    <img class="iconosNavegacion" src="./img/iconos/ventas.png" alt="ventas">
                    Ventas
                </button>
            </div>
            <div class="div-botones-nav">
                <button class="btn btn-light nav-buttons" onclick="mostrarVista('stock')">
                    <img class="iconosNavegacion" src="./img/iconos/almacen.png" alt="stock">
                    Stock
                </button>
            </div>
            <div class="div-botones-nav">
                <button class="btn btn-light nav-buttons" onclick="mostrarVista('combos')">
                    <img class="iconosNavegacion" src="./img/iconos/beer.png" alt="stock">
                    Combos
                </button>
            </div>
            <div class="div-botones-nav">
                <button class="btn btn-light nav-buttons" style="font-size: 1.2rem;" onclick="descargarExcelComprasRealizadas('stock')">
                    <img class="iconosNavegacion" src="./img/iconos/icons8-ms-excel-48.png" alt="excel">
                        Compras de clientes
                </button>
            </div>
        </nav>
        <div id="botonesDetalleVentas" class="botonesDetalleVentas" style="display: flex;">
            <button class="btn btn-dark boton-detalle" onclick="mostrarVentas('total')">
                Ventas del día: <span id="ventas-dia-total">Cargando...</span>
            </button>
        
            <button class="btn btn-dark boton-detalle" onclick="mostrarVentas('local')">
                Ventas en local del día: <span id="ventas-dia-local">Cargando...</span>
            </button>
        
            <button class="btn btn-dark boton-detalle" onclick="mostrarVentas('delivery')">
                Ventas por delivery del día: <span id="ventas-dia-delivery">Cargando...</span>
            </button>
        
            <button class="btn btn-dark boton-detalle" onclick="abrirModalVentasMes()">
                Ventas del mes...
            </button>
        </div>
        <!-- Vista de Ventas -->
        <div id="divVentas" style="display: flex;">
            <div class="divRealizarVenta">
                <div style="display: flex;justify-content: center;align-items: center;width: 100%;">
                    <h2 style="text-align: center;">Realizar Venta</h2>
                </div>
                <div style="display: flex; justify-content: start; align-items: start; margin-top: 20px;">
                    <div class="card">
                        <div class="col-md-12 p-4 my-auto">
                            <form id="formulario_venta">
                                <div class="form-group">
                                    <label class="mt-2" for="fechaVenta"><h5>Fecha de la Venta</h5></label>
                                    <input 
                                        type="date" 
                                        id="fechaVenta" 
                                        class="form-control" 
                                        value="${new Date().toISOString().split('T')[0]}" 
                                        required
                                    >
                                </div>
                                <div class="form-group">
                                    <label class="mt-2" for="nombreCliente"><h5>Nombre del cliente</h5></label>
                                    <input type="text" id="nombreCliente" placeholder="Nombre del comprador" class="form-control" required>
                                    <ul id="clienteSugerencias" class="list-group mt-2" style="display: none; position: absolute; z-index: 10; max-height: 200px; overflow-y: auto;"></ul>
                                </div>
                                <div class="form-group">
                                    <label class="mt-2" for="telefono"><h5>Telefono</h5></label>
                                    <input type="number" id="telefono" placeholder="telefono" class="form-control" required>
                                </div>

                                <div class="form-group">
                                    <label class="mt-2" for="tipoVenta"><h5>Tipo de Venta</h5></label>
                                    <select id="tipoVenta" class="form-control" onchange="actualizarTipoVenta()">
                                        <option value="local">Local</option>
                                        <option value="delivery">Delivery</option>
                                    </select>
                                </div>

                                
                                <div class="form-group">
                                    <label class="mt-2" for="direccion"><h5>Dirección</h5></label>
                                    <input type="text" id="direccion" placeholder="Dirección" class="form-control">
                                </div>



                                <!-- Campo de productos con cantidad seleccionable en la misma línea -->
                                <div class="form-group">
                                    <label class="mt-2" for="productos"><h5>Productos</h5></label>
                                    <div id="productosSeleccionados">
                                        <div class="input-group mb-3">
                                            <!-- Cambiamos el select a un input de texto -->
                                            <input type="text" id="inputProducto" class="form-control" placeholder="Buscar producto...">
                                            <ul id="dropdownProductos" class="dropdown-menu" style="width: 100%; display: none; margin-top: 10%;">
                                                <!-- Las opciones de productos se cargarán aquí dinámicamente -->
                                            </ul>
                                            <input type="number" id="cantidadProducto" class="form-control" placeholder="Cantidad" style="max-width: 140px;">
                                        </div>
                                    </div>
                                </div>
                                
                                <button type="button" onclick="agregarProductoVenta()" class="btn btn-info mt-1">Agregar Producto</button>

                                <div class="form-group">
                                    <label class="mt-2" for="costoEnvio"><h5>Costo del envío</h5></label>
                                    <input type="number" id="costoEnvio" placeholder="Costo del envío" class="form-control" onchange="actualizarTotalConEnvio()">
                                </div>
                                <div class="form-group">
                                    <label for="metodoPago">Método de Pago</label>
                                    <select id="metodoPago" class="form-control">
                                        <option value="efectivo">Efectivo</option>
                                        <option value="transferencia">Transferencia</option>
                                        <option value="debito">Débito</option>
                                        <option value="credito">Crédito</option>
                                        <option value="efectivo_y_otro">En partes: efectivo y otro</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label class="mt-2" for="total"><h5>Total con envío incluído</h5></label>
                                    <span id="totalConEnvio" class="form-control" style="display: inline-block; background: #f7f7f7; padding: 8px;">$0.00</span>
                                </div>
                                <button type="button" onclick="registrarNuevaVenta()" class="btn btn-success mt-1 btn-guardar">Guardar</button>
                            </form>
                        </div>
    
                    </div>
                    <!-- Contenedor para mostrar el resumen de productos y cantidades seleccionados -->
                    <div class="card p-4 mx-5" id="resumenVenta">
                        <h5>Resumen de Productos</h5>
                        <ul id="listaResumen" class="list-group">
                            <!-- Aquí se agregarán los productos y cantidades seleccionadas -->
                        </ul>
                    </div>
                </div>
            </div>

            
            <div class="divVentasRealizadas">
                <h2>Ventas realizadas</h2>
                
                <!-- Selector de fecha -->
                <div class="form-group" style="display: flex; justify-content: space-between; align-items: end; width: 400px;">
                    <div>
                        <label for="fechaVentas">Seleccionar Fecha:</label>
                        <input type="date" id="fechaVentas" class="form-control" onchange="cargarVentasPorFecha()">
                    </div>
                    <button class="btn btn-primary" style="width: 200px; height: 50px; font-size: small; letter-spacing: 1px;" onclick="descargarGananciasDelDia()">
                        <img style="width: 30px; margin-right: 5px;" src="./img/iconos/download_white.png" alt="excel">
                        Ganancias del Día
                    </button>
                </div>
                
                <!-- Contenedor de la lista de ventas realizadas -->
                <ul id="listaVentasRealizadas" class="list-group mt-3">
                    <!-- Aquí se mostrarán las ventas realizadas -->
                </ul>
            </div>
            
        </div>
    
        <!-- Vista de Stock -->
        <div id="divStock" style="display: none;">
            <div class="row">
                <div class="divBotonNuevoCliente">
                    <button onclick="abrirModalAgregarProducto()" class="btn btn-success botonNuevoCliente">Nuevo Producto</button>
                </div>
                <div class="">
                    <div class="divBotonLimpiarFiltro">
                        <input type="text" id="filtroTexto" class="form-control" placeholder="Buscar...">
                    </div>
                    <div id="divFechasFichas"></div>
                    <div style="position: relative;" id="fichas"></div>
                </div>
            </div>
        </div>

        <!-- Vista de Combos -->
        <div id="divCombos" style="display: none;">
            <div class="row">
                <div class="divBotonNuevoCombo">
                    <button onclick="abrirModalAgregarCombo()" class="btn btn-success botonNuevoCliente">Nuevo Combo</button>
                </div>
                <div class="">
                    <div class="divBotonLimpiarFiltro">
                        <input type="text" id="filtroTextoCombo" class="form-control" placeholder="Buscar...">
                    </div>
                    <div id="divListaCombos"></div>
                </div>
            </div>
        </div>

    </main>
    <footer>
        <div style="display: flex; justify-content: center; align-items: center; margin-left: 1%; text-align: center; width: 100%;">
            <p class="firma">Desarrollado por<strong> Gabriel Leguizamón</strong></p>
        </div>
        <div style="display: flex; justify-content: center; align-items: center; margin-left: 1%; text-align: center; width: 100%;">
            <span id="app-version">v1.4.0</span>
        </div>
    </footer>
</body>
<script src="./app.js"></script>
</html>
