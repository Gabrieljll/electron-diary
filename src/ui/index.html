<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pombero Alcoholic App</title>
    <link rel="stylesheet" href="./bootstrap.min.css">
    <link rel="stylesheet" href="./animate.css">
    <link rel="stylesheet" href="app.css">
</head>
<body>    
    <main class="container-fluid">
        <nav>
            <div>
                <img class="logoImg" src="img/productos/CSGO.jpg" alt="logo">
            </div>
            <div class="div-botones-nav">
                <button class="btn btn-light nav-buttons" onclick="mostrarVista('ventas')">Ventas</button>
            </div>
            <div class="div-botones-nav">
                <button class="btn btn-light nav-buttons" onclick="mostrarVista('stock')">Stock</button>
            </div>
        </nav>
    
        <!-- Vista de Ventas -->
        <div id="divVentas" style="display: flex;">
            <div class="divRealizarVenta">
                <div class="">
                    <h2>Realizar Venta</h2>
                    <div class="col-md-12 p-4 my-auto">
                        <form id="formulario_venta">
                            <div class="form-group">
                                <label class="mt-2" for="nombreCliente"><h5>Nombre del cliente</h5></label>
                                <input type="text" id="nombreCliente" placeholder="Nombre del comprador" class="form-control" required>
                            </div>
                            <div class="form-group">
                                <label class="mt-2" for="telefono"><h5>Telefono</h5></label>
                                <input type="number" id="telefono" placeholder="telefono" class="form-control" required>
                            </div>
                            <div class="form-group">
                                <label class="mt-2" for="direccion"><h5>Dirección</h5></label>
                                <input type="text" id="direccion" placeholder="Dirección" class="form-control">
                            </div>
                            <!-- Campo de productos con cantidad seleccionable en la misma línea -->
                            <div class="form-group">
                                <label class="mt-2" for="productos"><h5>Productos</h5></label>
                                <div id="productosSeleccionados">
                                    <div class="input-group mb-3">
                                        <select id="selectProducto" class="form-control">
                                            <!-- Las opciones de productos se cargarán aquí dinámicamente -->
                                        </select>
                                        <input type="number" id="cantidadProducto" class="form-control" placeholder="Cantidad" style="max-width: 140px;">
                                    </div>
                                </div>
                            </div>

                            <button type="button" onclick="agregarProductoVenta()" class="btn btn-info mt-1">Agregar Producto</button>
                            
                            <div class="form-group">
                                <label class="mt-2" for="costoEnvio"><h5>Costo del envío</h5></label>
                                <input type="number" id="costoEnvio" placeholder="Costo del envío" class="form-control" onchange="actualizarTotalConEnvio()">
                            </div>
                            <div class="form-group">
                                <label class="mt-2" for="total"><h5>Total con envío incluído</h5></label>
                                <span id="totalConEnvio" class="form-control" style="display: inline-block; background: #f7f7f7; padding: 8px;">$0.00</span>
                            </div>
                            <button type="button" onclick="registrarNuevaVenta()" class="btn btn-success mt-1 btn-guardar">Guardar</button>
                        </form>
                    </div>

                </div>
                    <!-- Contenedor para mostrar el resumen de productos y cantidades seleccionados -->
                    <div class="p-4 mt-5" id="resumenVenta">
                        <h5>Resumen de Productos</h5>
                        <ul id="listaResumen" class="list-group">
                            <!-- Aquí se agregarán los productos y cantidades seleccionadas -->
                        </ul>
                    </div>
            </div>
            <div class="divVentasRealizadas">
                <h2>Ventas realizadas</h2>
                
                <!-- Selector de fecha -->
                <div class="form-group">
                    <label for="fechaVentas">Seleccionar Fecha:</label>
                    <input type="date" id="fechaVentas" class="form-control" onchange="cargarVentasPorFecha()">
                </div>
                
                <!-- Contenedor de la lista de ventas realizadas -->
                <ul id="listaVentasRealizadas" class="list-group mt-3">
                    <!-- Aquí se mostrarán las ventas realizadas -->
                </ul>
            </div>
            
        </div>
    
        <!-- Vista de Stock -->
        <div id="divStock" style="display: none;">
            <div class="row">
                <div class="divBotonNuevoCliente">
                    <button onclick="abrirModalAgregarProducto()" class="btn btn-success botonNuevoCliente">Nuevo Producto</button>
                </div>
                <div class="">
                    <div class="divBotonLimpiarFiltro">
                        <input type="text" id="filtroTexto" class="form-control" placeholder="Buscar...">
                    </div>
                    <div id="divFechasFichas"></div>
                    <div style="position: relative;" id="fichas"></div>
                </div>
            </div>
        </div>
    </main>
    
</body>
<script src="./app.js"></script>
</html>
